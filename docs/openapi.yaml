  /api/v1/product-reviews:
    get:
      tags: [Product Reviews]
      summary: CRM reviews list, optionally filtered by status or product
      security: [{sanctumBearer: []}]
      parameters:
        - in: query
          name: status
          schema: {type: string, enum: [pending, approved, rejected]}
        - in: query
          name: product_id
          schema: {type: integer}
      responses:
        '200': {description: Paginated review models}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Product Reviews]
      summary: Create pending review from delivered order item
      description: Reviewer identity and verified purchase are derived server-side; client cannot set them.
      security: [{sanctumBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_item_id, rating]
              properties:
                order_item_id: {type: integer}
                rating: {type: integer, minimum: 1, maximum: 5}
                title: {type: string, nullable: true, maxLength: 150}
                body: {type: string, nullable: true, maxLength: 3000}
      responses:
        '201': {description: REVIEW_PENDING}
        '422': {description: Validation failed, duplicate review or order not delivered}

  /api/v1/product-reviews/{review}/moderate:
    parameters:
      - in: path
        name: review
        required: true
        schema: {type: string}
    patch:
      tags: [Product Reviews]
