openapi: 3.0.3
info:
  title: KHAM Commerce OS API
  version: 1.0.0
  description: |
    Laravel API route/method inventory and documented request/response contracts.
    Contract accuracy requires ongoing review against controller behavior and local tests.
    See docs/API_DOCUMENTATION.md.
servers:
  - url: http://localhost
    description: Local XAMPP (replace with your own base URL)
tags:
  - name: Authentication
    description: CRM authentication and password recovery
  - name: Community
    description: Public config-backed community page
  - name: CRM
    description: Authenticated commerce administration
  - name: Homepage
    description: Public homepage and CRM homepage content management
  - name: Ingredients
    description: Ingredient administration
  - name: Media
    description: Catalog image uploads and removal
  - name: Newsletter
    description: Newsletter subscriptions and subscriber administration
  - name: Partners
    description: Partner application submission and review
  - name: Product Reviews
    description: Product ratings and review moderation
  - name: Rituals
    description: Ritual content administration
  - name: Sandbox Payments
    description: Local and testing-only payment and checkout workflows
  - name: Storefront
    description: Public storefront catalog and checkout
  - name: Storefront Brands
    description: Public brand discovery
  - name: Storefront Ingredients
    description: Public ingredient discovery
  - name: Storefront Rituals
    description: Public ritual content
security: []
paths:
  /api/v1/storefront/community:
    get:
      operationId: get_storefront_community
      tags: [Community]
      summary: Public community page content from approved configuration
      description: 'Static/config-backed phase; sections and links are empty until approved content is supplied. No member submissions or CRM editor.'
      parameters:
        - in: query
          name: locale
          schema: {type: string, enum: [en, ar], default: en}
      responses:
        '200':
          description: 'Community page content; STOREFRONT_COMMUNITY'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [locale, title, intro, sections, links]
                        properties:
                          locale: {type: string, enum: [en, ar]}
                          title: {type: string}
                          intro: {type: string}
                          sections:
                            type: array
                            items:
                              type: object
                              properties:
                                key: {type: string, nullable: true}
                                title: {type: string}
                                body: {type: string}
                                image_url: {type: string, nullable: true}
                                link_url: {type: string, nullable: true}
                          links: {type: array, items: {type: object}}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: 'Rate limit exceeded'}
  /api/v1/storefront/homepage:
    get:
      operationId: get_storefront_homepage
      tags: [Homepage]
      summary: Published homepage sections in English or Arabic
      parameters:
        - in: query
          name: locale
          schema: {type: string, enum: [en, ar], default: en}
      responses:
        '200':
          description: Published sections ordered by sort_order then id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/PublicHomepageSection'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/homepage/sections:
    get:
      operationId: get_homepage_sections
      tags: [Homepage]
      summary: CRM homepage section listing (products.view)
      security: [{sanctumBearer: []}]
      parameters:
        - in: query
          name: type
          schema: {type: string, enum: [hero, banner, featured, promotion, editorial, custom]}
      responses:
        '200': {description: 'Paginated section listing'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: post_homepage_sections
      tags: [Homepage]
      summary: Create homepage section (products.manage)
      security: [{sanctumBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HomepageSectionInput'}
      responses:
        '201': {description: 'Section created'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/homepage/sections/{section}:
    parameters:
      - in: path
        name: section
        required: true
        schema: {type: integer}
    patch:
      operationId: patch_homepage_sections_by_section
      tags: [Homepage]
      summary: Update homepage section (products.manage)
      security: [{sanctumBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HomepageSectionInput'}
      responses:
        '200': {description: 'Section updated'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 'Section not found'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      operationId: delete_homepage_sections_by_section
      tags: [Homepage]
      summary: Delete homepage section (products.manage)
      security: [{sanctumBearer: []}]
      responses:
        '200': {description: 'Section deleted'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 'Section not found'}
  /api/v1/storefront/partners/apply:
    post:
      operationId: post_storefront_partners_apply
      tags: [Partners]
      summary: Submit partner application (rate limited)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PartnerApplicationInput'}
      responses:
        '201':
          description: Application accepted; no applicant PII returned
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: 'Rate limit exceeded'}
  /api/v1/partner-applications:
    get:
      operationId: get_partner_applications
      tags: [Partners]
      summary: CRM applications listing (customers.view)
      security: [{sanctumBearer: []}]
      parameters:
        - in: query
          name: status
          schema: {type: string, enum: [pending, in_review, approved, rejected]}
        - in: query
          name: partner_type
          schema: {type: string, enum: [retailer, distributor, influencer, corporate, other]}
      responses:
        '200': {description: 'Paginated applications including applicant PII; CRM only'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/partner-applications/{application}:
    parameters:
      - in: path
        name: application
        required: true
        schema: {type: integer}
    get:
      operationId: get_partner_applications_by_application
      tags: [Partners]
      summary: CRM application detail (customers.view)
      security: [{sanctumBearer: []}]
      responses:
        '200': {description: 'Application details; CRM only'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 'Application not found'}
    patch:
      operationId: patch_partner_applications_by_application
      tags: [Partners]
      summary: Review application (customers.manage)
      security: [{sanctumBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [pending, in_review, approved, rejected]}
                internal_notes: {type: string, nullable: true, maxLength: 5000}
      responses:
        '200': {description: 'Updated application with reviewer metadata'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 'Application not found'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/storefront/newsletter/subscribe:
    post:
      operationId: post_storefront_newsletter_subscribe
      tags: [Newsletter]
      summary: Subscribe or resubscribe email (rate limited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 255}
      responses:
        '200': {description: 'Subscription request processed'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: 'Rate limit exceeded'}
  /api/v1/storefront/newsletter/unsubscribe:
    post:
      operationId: post_storefront_newsletter_unsubscribe
      tags: [Newsletter]
      summary: Process unsubscribe token without disclosing subscription status
      description: Returns the same success envelope whether or not the token matches an active subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 64, maxLength: 64}
      responses:
        '200': {description: 'NEWSLETTER_UNSUBSCRIBE_RECEIVED; data is null'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: 'Rate limit exceeded'}

  /api/v1/storefront/products/{product}/reviews:
    parameters:
      - in: path
        name: product
        required: true
        schema: {type: string}
    get:
      operationId: get_storefront_products_by_product_reviews
      tags: [Product Reviews]
      summary: Approved reviews and rating summary for active product
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1}
        - in: query
          name: per_page
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        '200': {description: 'PRODUCT_REVIEWS; data has reviews, review_count and average_rating'}
        '404': {description: 'Product inactive or not found'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /api/v1/storefront/ritual-quiz/questions:
    get:
      operationId: get_storefront_ritual_quiz_questions
      tags: [Storefront]
      summary: 'Active localized quiz questions and options'
      responses:
        '200': {description: 'RITUAL_QUIZ'}
        '400': {description: 'Malformed request'}

  /api/v1/storefront/ritual-quiz/recommendations:
    post:
      operationId: post_storefront_ritual_quiz_recommendations
      tags: [Storefront]
      summary: 'Recommend market-eligible products from selected quiz options'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                market_id: {description: 'Validated by controller'}
                option_ids: {description: 'Validated by controller'}
      responses:
        '200': {description: 'RITUAL_RECOMMENDATIONS'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /api/v1/storefront/ingredients:
    get:
      operationId: get_storefront_ingredients
      tags: [Storefront Ingredients]
      summary: List active ingredients with localized names and descriptions
      parameters:
        - in: query
          name: search
          schema: {type: string, maxLength: 120}
      responses:
        '200': {description: 'STOREFRONT_INGREDIENTS; paginated active ingredient list'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /api/v1/storefront/ingredients/{slug}:
    parameters:
      - in: path
        name: slug
        required: true
        schema: {type: string}
    get:
      operationId: get_storefront_ingredients_by_slug
      tags: [Storefront Ingredients]
      summary: Get an active ingredient by slug
      responses:
        '200': {description: 'STOREFRONT_INGREDIENT; localized id, slug, name, description'}
        '404': {description: 'Ingredient not found or inactive'}

  /api/v1/storefront/rituals:
    get:
      operationId: get_storefront_rituals
      tags: [Storefront Rituals]
      summary: Paginated published rituals with localized content
      responses:
        '200': {description: 'STOREFRONT_RITUALS; published rituals ordered by sort_order and id'}
        '400': {description: 'Malformed request'}

  /api/v1/storefront/rituals/{slug}:
    parameters:
      - in: path
        name: slug
        required: true
        schema: {type: string}
    get:
      operationId: get_storefront_rituals_by_slug
      tags: [Storefront Rituals]
      summary: Published ritual detail including localized steps and active products
      responses:
        '200': {description: 'STOREFRONT_RITUAL; ritual fields plus steps and products'}
        '404': {description: 'Ritual not found or unpublished'}

  /api/v1/storefront/brands:
    get:
      operationId: get_storefront_brands
      tags: [Storefront Brands]
      summary: Paginated active brands with localized display fields
      parameters:
        - in: query
          name: search
          schema: {type: string, maxLength: 120}
        - in: query
          name: page
          schema: {type: integer, minimum: 1}
      responses:
        '200': {description: 'STOREFRONT_BRANDS; localized brand list with pagination meta'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /api/v1/storefront/brands/{slug}:
    parameters:
      - in: path
        name: slug
        required: true
        schema: {type: string}
    get:
      operationId: get_storefront_brands_by_slug
      tags: [Storefront Brands]
      summary: Active brand detail and up to 100 active market-eligible products
      parameters:
        - in: query
          name: market_id
          required: true
          schema: {type: integer}
      responses:
        '200': {description: 'STOREFRONT_BRAND; data contains brand and products arrays'}
        '404': {description: 'Active brand not found'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /api/v1/storefront/products:
    get:
      operationId: get_storefront_products
      tags: [Storefront]
      summary: 'List active market-priced storefront products'
      description: 'Returns active products with sellable variants, localized fields and availability in the market fulfillment warehouse. No-store response.'
      parameters:
        - in: query
          name: market_id
          required: true
          schema: {type: integer}
        - in: query
          name: search
          schema: {type: string, maxLength: 120}
        - in: query
          name: page
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: 'STOREFRONT_PRODUCTS with pagination metadata'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  code: {type: string, example: STOREFRONT_PRODUCTS}
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, slug, name, currency_code, variants]
                      properties:
                        id: {type: integer}
                        slug: {type: string}
                        badges: {type: array, items: {type: string}}
                        locale: {type: string}
                        name: {type: string}
                        short_description: {type: string, nullable: true}
                        description: {type: string, nullable: true}
                        ingredients: {type: string, nullable: true}
                        linked_ingredients:
                          type: array
                          items:
                            type: object
                            properties:
                              id: {type: integer}
                              slug: {type: string}
                              name: {type: string}
                              description: {type: string, nullable: true}
                        usage_instructions: {type: string, nullable: true}
                        currency_code: {type: string}
                        variants:
                          type: array
                          items:
                            type: object
                            properties:
                              id: {type: integer}
                              title: {type: string}
                              price: {type: string, nullable: true}
                              in_stock: {type: boolean}
                  meta: {type: object}
        '422': {$ref: '#/components/responses/ValidationError'}

  /api/v1/storefront/products/{product}:
    parameters:
      - in: path
        name: product
        required: true
        schema: {type: string}
    get:
      operationId: get_storefront_products_by_product
      tags: [Storefront]
      summary: 'Get market-eligible active storefront product'
      description: 'Inactive or non-sellable products return 404. Localized content and market stock availability; no-store response.'
      parameters:
        - in: query
          name: market_id
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: 'STOREFRONT_PRODUCT'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  code: {type: string, example: STOREFRONT_PRODUCT}
                  data:
                    type: object
                    required: [id, slug, name, currency_code, variants]
                    properties:
                      id: {type: integer}
                      slug: {type: string}
                      badges: {type: array, items: {type: string}}
                      locale: {type: string}
                      name: {type: string}
                      short_description: {type: string, nullable: true}
                      description: {type: string, nullable: true}
                      ingredients: {type: string, nullable: true}
                      linked_ingredients:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            slug: {type: string}
                            name: {type: string}
                            description: {type: string, nullable: true}
                      usage_instructions: {type: string, nullable: true}
                      currency_code: {type: string}
                      variants:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            title: {type: string}
                            price: {type: string, nullable: true}
                            in_stock: {type: boolean}
        '404': {description: 'Product not found or unavailable for market'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /api/v1/storefront/payments/myfatoorah/local-webhook:
    post:
      operationId: post_storefront_payments_myfatoorah_local_webhook
      tags: [Sandbox Payments]
      summary: 'Local/testing-only signed MyFatoorah webhook; 64 KiB JSON limit; signed identifiers matched to stored payment and authoritative provider details'
      description: Disabled by default; local/testing environment and explicit feature flags required. Never use as a production payment endpoint.
      responses:
        '200': {description: 'SANDBOX_PAYMENT_VERIFIED'}
        '202': {description: 'PAYMENT_NOT_CONFIRMED'}
        '404': {description: 'Endpoint disabled or order not found'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '400': {description: 'INVALID_WEBHOOK_BODY; invalid JSON or payload exceeds 64 KiB'}

  /api/v1/storefront/checkout/test-order:
    post:
      operationId: post_storefront_checkout_test_order
      tags: [Sandbox Payments]
      summary: 'Local-only mock checkout; no card collection or real payment; idempotency key and market, cart, customer, address required'
      description: Disabled by default; local/testing environment and explicit feature flags required. Never use as a production payment endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotency_key: {type: string, minLength: 16, maxLength: 128}
                market_id: {type: integer}
                items: {type: array, minItems: 1, maxItems: 25, items: {type: object}}
                payment_method: {type: string, enum: [mock_fatoora]}
                customer: {type: object}
                shipping_address: {type: object}
      responses:
        '201': {description: 'MOCK_CHECKOUT_ORDER'}
        '200': {description: 'Idempotent replay'}
        '404': {description: 'Endpoint disabled or order not found'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /api/v1/storefront/checkout/quote:
    post:
      operationId: post_storefront_checkout_quote
      tags: [Storefront]
      summary: 'Public non-binding quote with stock checks and no client prices'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [market_id, items, shipping_address]
              properties:
                market_id: {type: integer}
                items:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    required: [variant_id, quantity]
                    properties:
                      variant_id: {type: integer}
                      quantity: {type: integer, minimum: 1, maximum: 100}
                shipping_address:
                  type: object
                  required: [country_code, city]
                  properties:
                    country_code: {type: string, minLength: 2, maxLength: 2}
                    city: {type: string, maxLength: 120}
              description: 'Client unit_price and coupon_code are prohibited; stock and prices are server verified.'
      responses:
        '200':
          description: 'Provisional quote; final payable total not authorized'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      locale: {type: string}
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            variant_id: {type: integer}
                            quantity: {type: integer}
                            product_name: {type: string}
                            variant_title: {type: string, nullable: true}
                      market_id: {type: integer}
                      currency_code: {type: string}
                      subtotal: {type: string}
                      discount_total: {type: string}
                      net_subtotal: {type: string}
                      shipping: {type: object}
                      total_before_tax: {type: string}
                      tax_status: {type: string}
                      tax_total: {type: string, nullable: true}
                      is_final_payable_total: {type: boolean}
        '422': {$ref: '#/components/responses/ValidationError'}

  /api/v1/auth/forgot-password:
    post:
      operationId: post_auth_forgot_password
      tags: [Authentication]
      summary: Request CRM password reset without account enumeration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 255}
      responses:
        '200': {description: 'AUTH_RESET_REQUESTED; same public response for known and unknown emails'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: 'Rate limit exceeded'}
        '503': {description: 'AUTH_RESET_UNAVAILABLE; secure frontend reset URL not configured'}

  /api/v1/auth/reset-password:
    post:
      operationId: post_auth_reset_password
      tags: [Authentication]
      summary: Reset CRM password and revoke existing API tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: {type: string, format: email, maxLength: 255}
                token: {type: string}
                password: {type: string, minLength: 12}
                password_confirmation: {type: string, minLength: 12}
      responses:
        '200': {description: 'AUTH_RESET_COMPLETE'}
        '422': {description: 'Invalid or expired token, mismatched confirmation or invalid input'}
        '429': {description: 'Rate limit exceeded'}

  /api/v1/auth/login:
    post:
      operationId: post_auth_login
      tags: [Authentication]
      summary: Authenticate CRM user and issue Sanctum bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
                device_name: {type: string, nullable: true, maxLength: 100}
      responses:
        '200': {description: 'AUTH_LOGIN; data contains token, token_type and user with roles.permissions'}
        '401': {description: 'AUTH_INVALID; invalid email or password'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: 'Rate limit exceeded'}

  /api/v1/auth/me:
    get:
      operationId: get_auth_me
      tags: [Authentication]
      summary: Current authenticated CRM user with roles and permissions
      security: [{sanctumBearer: []}]
      responses:
        '200': {description: 'Current user in ApiResponse data'}
        '401': {$ref: '#/components/responses/Unauthenticated'}

  /api/v1/auth/logout:
    post:
      operationId: post_auth_logout
      tags: [Authentication]
      summary: Revoke the current Sanctum access token
      security: [{sanctumBearer: []}]
      responses:
        '200': {description: 'AUTH_LOGOUT; data is null'}
        '401': {$ref: '#/components/responses/Unauthenticated'}

  /api/v1/dashboard:
    get:
      operationId: get_dashboard
      tags: [CRM]
      summary: 'CRM dashboard totals, statuses and seven-day sales'
      security: [{sanctumBearer: []}]
      responses:
        '200':
          description: 'DASHBOARD'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orders_today: {type: integer}
                      revenue_today: {type: number}
                      orders_week: {type: integer}
                      revenue_week: {type: number}
                      pending_orders: {type: integer}
                      customers_total: {type: integer}
                      active_products: {type: integer}
                      low_stock_skus: {type: integer}
                      orders_by_status: {type: object}
                      products_by_status: {type: object}
                      sales_last_7_days: {type: array, items: {type: object}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/products:
    get:
      operationId: get_products
