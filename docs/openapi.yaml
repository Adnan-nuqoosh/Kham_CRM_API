components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Laravel Sanctum token
  schemas:
    ApiSuccess:
      type: object
      properties:
        success: {type: boolean, example: true}
        code: {type: string}
        message: {type: string}
        data: {type: string, nullable: true}
        meta: {type: object}
        errors: {type: object}
    PublicHomepageSection:
      type: object
      properties:
        key: {type: string}
        type: {type: string}
        title: {type: string}
        subtitle: {type: string, nullable: true}
        image_url: {type: string, nullable: true}
        link_url: {type: string, nullable: true}
        content: {type: object, nullable: true}
        sort_order: {type: integer}
    HomepageSectionInput:
      type: object
      description: POST requires key, type and title_en; PATCH accepts a subset.
      properties:
        key: {type: string, maxLength: 100, pattern: '^[a-z0-9][a-z0-9_-]*$'}
        type: {type: string, enum: [hero, banner, featured, promotion, editorial, custom]}
        title_en: {type: string, maxLength: 255}
        title_ar: {type: string, nullable: true, maxLength: 255}
        subtitle_en: {type: string, nullable: true, maxLength: 5000}
        subtitle_ar: {type: string, nullable: true, maxLength: 5000}
        image_url: {type: string, format: uri, nullable: true}
        link_url: {type: string, nullable: true}
        content: {type: object, nullable: true}
        sort_order: {type: integer, minimum: 0, maximum: 1000000}
        is_published: {type: boolean}
    IngredientInput:
      type: object
      description: POST requires slug and name; PATCH accepts partial fields.
      properties:
        slug: {type: string, maxLength: 255}
        name: {type: string, maxLength: 255}
        name_ar: {type: string, nullable: true, maxLength: 255}
        description: {type: string, nullable: true}
        description_ar: {type: string, nullable: true}
        is_active: {type: boolean}
    RitualInput:
      type: object
      description: POST requires slug and title. Supplying steps or products replaces their existing relations on PATCH.
      properties:
        slug: {type: string, maxLength: 255}
        title: {type: string, maxLength: 255}
        title_ar: {type: string, nullable: true, maxLength: 255}
        description: {type: string, nullable: true}
        description_ar: {type: string, nullable: true}
        image_url: {type: string, nullable: true, maxLength: 2048}
        is_published: {type: boolean}
        sort_order: {type: integer, minimum: 0}
        steps:
          type: array
          maxItems: 50
          items:
            type: object
            required: [title, instructions]
            properties:
              title: {type: string, maxLength: 255}
              title_ar: {type: string, nullable: true, maxLength: 255}
              instructions: {type: string}
              instructions_ar: {type: string, nullable: true}
              sort_order: {type: integer, minimum: 0}
        products:
          type: array
          maxItems: 100
          items:
            type: object
            required: [product_id]
            properties:
              product_id: {type: integer}
              sort_order: {type: integer, minimum: 0}
    PartnerApplicationInput:
      type: object
      required: [contact_name, email, company_name, partner_type]
      properties:
        contact_name: {type: string, maxLength: 150}
        email: {type: string, format: email, maxLength: 255}
        phone: {type: string, nullable: true, maxLength: 50}
        company_name: {type: string, maxLength: 200}
        website: {type: string, format: uri, nullable: true, maxLength: 500}
        partner_type: {type: string, enum: [retailer, distributor, influencer, corporate, other]}
        message: {type: string, nullable: true, maxLength: 5000}
  responses:
    ValidationError:
      description: Invalid request parameters (Laravel validation error)
    Unauthenticated:
      description: Bearer token missing or invalid
    Forbidden:
      description: Authenticated user lacks the required permission
