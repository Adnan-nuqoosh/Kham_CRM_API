name: One-time secure dependency refresh

on:
  push:
    branches:
      - feature/storefront-phase1-phase2-20261118
    paths:
      - .github/workflows/kham-dependency-refresh.yml

permissions:
  contents: write

jobs:
  security-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3, intl, xml
          coverage: none
      - name: Resolve compatible patched dependency versions
        run: composer update --with-all-dependencies --no-interaction --no-progress
      - name: Reject known vulnerabilities in resolved lockfile
        run: composer audit --locked --no-interaction
      - name: Syntax lint
        run: find app database/migrations routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Full isolated Laravel test suite
        run: vendor/bin/phpunit --display-warnings --colors=never
      - name: Validate OpenAPI parity
        run: php scripts/local_openapi_full_coverage.php
      - name: Commit only audited lockfile
        run: |
          if git diff --quiet -- composer.lock; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "security: refresh audited Composer lockfile [skip ci]"
          git push origin HEAD:feature/storefront-phase1-phase2-20261118
